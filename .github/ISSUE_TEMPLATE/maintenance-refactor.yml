name: 'Maintenance: refactoring'
description: Restructuring with no change in behavior
labels: ['refactor']
body:
  - type: textarea
    id: current
    attributes:
      label: Current state
      description: What does the code or setup look like today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What would you change, and why is it better?
    validations:
      required: true

  - type: checkboxes
    id: behavior
    attributes:
      label: Behavior
      options:
        - label: This does not change smocket's delivery behavior
