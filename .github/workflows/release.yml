name: Publish release

run-name: Publish ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact synchronized package version
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: npm-publication
  cancel-in-progress: false

# Candidate and published-package adoption resolve fresh dependency graphs.
# Keep their installer aligned with the npm CLI used for trusted publication.
env:
  RELEASE_NPM_VERSION: 11.6.4

jobs:
  authorize:
    name: authorize main repository release
    runs-on: ubuntu-latest
    steps:
      - name: Require the canonical repository and main branch
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_REF: ${{ github.ref }}
        shell: bash
        run: |
          test "$RELEASE_REPOSITORY" = "electrohyun/smocket"
          test "$RELEASE_REF" = "refs/heads/main"

  certify-ci:
    name: certify exact SHA CI
    needs: authorize
    runs-on: ubuntu-latest
    outputs:
      run-id: ${{ steps.ci.outputs.run-id }}
    steps:
      - name: Require a successful main CI run for this SHA
        id: ci
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const response = await github.rest.actions.listWorkflowRuns({
              ...context.repo,
              workflow_id: 'ci.yml',
              branch: 'main',
              event: 'push',
              head_sha: context.sha,
              status: 'completed',
              per_page: 100,
            });
            const run = response.data.workflow_runs.find(
              (candidate) =>
                candidate.head_sha === context.sha &&
                candidate.head_branch === 'main' &&
                candidate.event === 'push' &&
                candidate.conclusion === 'success',
            );
            if (!run) {
              core.setFailed(`No successful main CI run exists for ${context.sha}`);
              return;
            }
            core.setOutput('run-id', String(run.id));
            core.info(`Certified ${context.sha} with ${run.html_url}`);

  preflight:
    name: promote the certified release candidate
    needs: certify-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Download the candidate verified by exact-SHA CI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-candidate-${{ github.sha }}
          path: .release-candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.certify-ci.outputs.run-id }}
      - name: Match the requested version to the candidate
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node scripts/publish-release-candidate.mjs verify \
            --manifest .release-candidate/release-candidate.json \
            --version "$RELEASE_VERSION"
      - name: Preserve the candidate for publication jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: npm-release-candidate-${{ github.run_id }}
          path: .release-candidate
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  publish-root:
    name: publish smocket
    needs: preflight
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global "npm@$RELEASE_NPM_VERSION"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: npm-release-candidate-${{ github.run_id }}
          path: .release-candidate
      - name: Reverify and publish the root tarball
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node scripts/publish-release-candidate.mjs publish \
            --manifest .release-candidate/release-candidate.json \
            --version "$RELEASE_VERSION" \
            --package smocket

  publish-client:
    name: publish smocket-client
    needs: publish-root
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global "npm@$RELEASE_NPM_VERSION"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: npm-release-candidate-${{ github.run_id }}
          path: .release-candidate
      - name: Reverify and publish the client tarball
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node scripts/publish-release-candidate.mjs publish \
            --manifest .release-candidate/release-candidate.json \
            --version "$RELEASE_VERSION" \
            --package smocket-client

  verify-published:
    name: verify exact published release
    needs: publish-client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install the release npm runner
        run: npm install --global "npm@$RELEASE_NPM_VERSION"
      - name: Install and exercise the exact published pair
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/verify-published-release.mjs --version "$RELEASE_VERSION"
